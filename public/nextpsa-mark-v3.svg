<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" role="img" aria-labelledby="title desc">
  <title id="title">NextPSA branching mark</title>
  <desc id="desc">Blue branching network with blue success node and red consequence node.</desc>
  <defs>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33b6ff"/>
      <stop offset="0.55" stop-color="#0a67de"/>
      <stop offset="1" stop-color="#073f99"/>
    </linearGradient>
    <radialGradient id="blueNode" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#58d4ff"/>
      <stop offset="0.55" stop-color="#1b9cf0"/>
      <stop offset="1" stop-color="#0b59cf"/>
