<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">NextPSA branching network mark</title>
  <desc id="desc">A blue branching path ending in a blue success node and a red consequence node.</desc>
  <defs>
    <linearGradient id="bluePath" x1="8" y1="32" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3f96"/>
      <stop offset="0.55" stop-color="#1769dc"/>
      <stop offset="1" stop-color="#20b8ff"/>
    </linearGradient>
    <linearGradient id="blueNode" x1="43" y1="7" x2="59" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29c4ff"/>
      <stop offset="1" stop-color="#1557d7"/>
    </linearGradient>
    <linearGradient id="redNode" x1="44" y1="40" x2="59" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5c2b"/>
      <stop offset="1" stop-color="#df0d26"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#bluePath)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 32H23"/>
    <path d="M23 32H31V20H39L46 14H50"/>
    <path d="M23 32H31V44H40L46 50H50"/>
  </g>
  <rect x="20" y="25" width="14" height="14" rx="4" fill="none" stroke="#0d56c8" stroke-width="4"/>
  <circle cx="54" cy="14" r="8" fill="url(#blueNode)" stroke="#0a47be" stroke-width="1.4"/>
  <circle cx="54" cy="50" r="8" fill="url(#redNode)" stroke="#c50920" stroke-width="1.4"/>
</svg>
